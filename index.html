<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Habitación de Nina</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="c"></div>
<div class="hud"><h1 class="pill">🏡 La Habitación de Nina</h1>
<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="pill" id="lc">✉️ 0/7</span><span class="pill" id="cnt">💗 0/10</span><button class="pill" id="ht" aria-label="Pista">💡</button><button class="pill" id="dn" aria-label="Día o noche">🌙</button><button class="pill" id="snd" aria-label="Música">🔊</button></div></div>
<div id="ring"></div><div id="ts" class="pill"></div>
<div id="hint" class="pill">Arrastra para mirar · Toca los objetos · Toca el suelo y la jirafita caminará</div>
<div id="m"><div class="card" id="mc"><div id="mt"></div><div id="mb"></div><button id="mx">Cerrar</button></div></div>
<noscript>Necesitas activar JavaScript para entrar a la habitación 💗</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/habitacion.js"></script>
</body></html>
